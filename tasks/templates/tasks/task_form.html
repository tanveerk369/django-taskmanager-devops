<!DOCTYPE html>
<html>
<head>
    <title>Task Form</title>
</head>
<body>

    <h1>Task Form</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Title:</label><br>
        <input type="text" name="title"
               value="{{ task.title|default:'' }}" required>

        <br><br>

        <label>Description:</label><br>
        <textarea name="description">{{ task.description|default:'' }}</textarea>

        <br><br>

        <label>Status:</label>

        <select name="status">
            <option value="Pending"
                {% if task.status == 'Pending' %}selected{% endif %}>
                Pending
            </option>

            <option value="In Progress"
                {% if task.status == 'In Progress' %}selected{% endif %}>
                In Progress
            </option>

            <option value="Completed"
                {% if task.status == 'Completed' %}selected{% endif %}>
                Completed
            </option>
        </select>

        <br><br>

        <button type="submit">Save Task</button>
    </form>

    <br>

    <a href="{% url 'task_list' %}">Back</a>

</body>
</html>
