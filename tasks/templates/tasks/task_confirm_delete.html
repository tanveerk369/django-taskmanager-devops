<!DOCTYPE html>
<html>
<head>
    <title>Delete Task</title>
</head>
<body>

    <h2>Are you sure you want to delete this task?</h2>

    <p>{{ task.title }}</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Confirm Delete</button>
    </form>

    <a href="{% url 'task_list' %}">Cancel</a>

</body>
</html>
